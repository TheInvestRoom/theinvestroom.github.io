<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte mentale : l'inertie thermique d'un bâtiment</title>
<style>
  :root { --ink: #24292f; --muted: #5b6470; --paper: #fbfaf7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  .bar { position: sticky; top: 0; left: 0; z-index: 2; display: flex; gap: 8px; align-items: center;
         padding: 10px 16px; background: rgba(251,250,247,.92); border-bottom: 1px solid #e4e0d8; }
  .bar span { margin-right: auto; font-size: 13px; color: var(--muted); }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid #c9c4b9; border-radius: 6px;
           background: #fff; color: var(--ink); cursor: pointer; }
  button:hover { background: #f1eee7; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 1400px; height: auto; }
  .branch { cursor: pointer; }
  .branch:focus { outline: none; }
  .branch:focus-visible rect:first-child { stroke: var(--ink); stroke-width: 3; }
  footer { padding: 4px 16px 18px; font-size: 13px; color: var(--muted); text-align: center; }
  @media print {
    @page { size: A3 landscape; margin: 8mm; }
    .bar { display: none; }
    body { background: #fff; }
    svg { min-width: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="bar">
  <span>Cliquez sur une branche pour la replier ou la déplier.</span>
  <button id="open">Tout déplier</button>
  <button id="close">Tout replier</button>
  <button onclick="print()">Imprimer</button>
</div>
<div class="scroll"><svg id="map" role="img" aria-label="Carte mentale de l'inertie thermique d'un bâtiment"></svg></div>
<footer>Les valeurs sont des ordres de grandeur : elles varient selon la densité et la formulation des matériaux.</footer>

<script>
const n = (t, ...c) => ({ t, c });

const RIGHT = [
  { t: "Définition", color: "#B3261E", c: [
    n("Stocker la chaleur puis la restituer lentement"),
    n("Différente de l'isolation",
      n("Isolation : freine le flux de chaleur (R en m²·K/W)"),
      n("Inertie : stocke la chaleur et la décale dans le temps")),
    n("Deux modes",
      n("Par transmission : l'onde de chaleur traverse l'enveloppe"),
      n("Par absorption : les parois intérieures captent les apports internes et solaires")),
  ]},
  { t: "Grandeurs physiques", color: "#C2410C", c: [
    n("Capacité volumique ρ·c",
      n("Chaleur stockée par m³ et par kelvin (kJ/m³·K)")),
    n("Conductivité λ",
      n("Facilité à conduire la chaleur (W/m·K)")),
    n("Diffusivité a = λ / (ρ·c)",
      n("Vitesse de propagation (m²/s)"),
      n("a faible : déphasage élevé")),
    n("Effusivité E = √(λ·ρ·c)",
      n("Absorption de chaleur en surface (J/m²·K·s½)"),
      n("E élevée : la paroi intérieure capte bien les apports")),
    n("Profondeur de pénétration",
      n("δ = √(a·P/π), avec P la période du cycle"),
      n("Béton sur 24 h : δ ≈ 15 cm")),
  ]},
  { t: "Effets", color: "#92670A", c: [
    n("Déphasage",
      n("Retarde le pic de chaleur entre l'extérieur et l'intérieur"),
      n("Cible courante : 10 à 12 h, pour que le pic arrive la nuit")),
    n("Amortissement",
      n("Réduit l'amplitude des variations de température")),
    n("En été",
      n("Limite la surchauffe et le besoin de climatisation")),
    n("En hiver",
      n("Valorise les apports gratuits : soleil, occupants, appareils")),
    n("Sur la puissance",
      n("Décale et lisse les appels de chauffage")),
  ]},
  { t: "Facteurs déterminants", color: "#2E7D32", c: [
    n("Masse accessible",
      n("Parois en contact direct avec l'air intérieur"),
      n("Épaisseur utile sur 24 h : environ 10 cm")),
    n("Position de l'isolant",
      n("ITE : la masse du mur reste côté intérieur"),
      n("ITI : la masse du mur est coupée de l'ambiance")),
    n("Planchers et refends",
      n("Lourds : grande surface d'échange")),
    n("Revêtements",
      n("Faux plafond, moquette et doublage réduisent l'échange")),
  ]},
];

const LEFT = [
  { t: "Évaluation", color: "#AD1457", c: [
    n("Règles Th-I",
      n("Classes : de très légère à très lourde"),
      n("Inertie quotidienne et séquentielle"),
      n("Capacité Cm et surface d'échange Am")),
    n("RE2020",
      n("Indicateur de confort d'été en degrés-heures (DH)"),
      n("Logement : seuils de 350 et 1 250 DH")),
    n("Simulation thermique dynamique",
      n("Comportement heure par heure, sur une année type")),
  ]},
  { t: "Limites", color: "#5E35B1", c: [
    n("Nuits chaudes, canicule longue",
      n("Sans décharge, la chaleur reste stockée")),
    n("Occupation intermittente",
      n("Relance lente du chauffage ou du rafraîchissement")),
    n("Matériaux lourds",
      n("Surcharge pour la structure"),
      n("Empreinte carbone du béton")),
    n("Ne remplace pas l'isolation"),
  ]},
  { t: "Conception", color: "#1565C0", c: [
    n("Ventilation nocturne",
      n("Évacue la chaleur stockée : indispensable en été")),
    n("Protections solaires",
      n("Bloquent les apports avant qu'ils soient stockés")),
    n("Masse côté intérieur",
      n("ITE, dalles et refends laissés apparents")),
    n("Toiture légère",
      n("Isolant dense pour gagner du déphasage")),
    n("Contexte le plus favorable",
      n("Forte amplitude jour/nuit"),
      n("Occupation continue : logement, hôpital")),
  ]},
  { t: "Matériaux", color: "#00796B", c: [
    n("Stockage ρ·c (kJ/m³·K)",
      n("Eau ≈ 4 200"),
      n("Béton ≈ 2 300"),
      n("Pierre ≈ 2 000"),
      n("Terre crue ≈ 1 800"),
      n("Brique pleine ≈ 1 500"),
      n("Bois massif ≈ 800")),
    n("Déphasage de 20 cm d'isolant",
      n("Fibre de bois dense ≈ 12 h"),
      n("Laine minérale ≈ 4 h")),
    n("Matériaux à changement de phase",
      n("Stockage latent sous faible épaisseur")),
  ]},
];

/* ---------- Mise en page ---------- */
const FONT = '"Segoe UI", system-ui, -apple-system, Arial, sans-serif';
const STYLE = {
  1: { size: 16, weight: 600, max: 150, padX: 14, padY: 10, line: 21 },
  2: { size: 14, weight: 600, max: 210, padX: 10, padY: 7,  line: 18 },
  3: { size: 13.5, weight: 400, max: 270, padX: 2,  padY: 4,  line: 18 },
};
const GAP = { 1: 26, 2: 10, 3: 2 };
const COL_GAP = 46;
const ctx = document.createElement("canvas").getContext("2d");
const SVG = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");

function wrap(text, s) {
  ctx.font = `${s.weight} ${s.size}px ${FONT}`;
  const lines = [];
  let cur = "";
  for (const w of text.split(" ")) {
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > s.max && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  lines.push(cur);
  const width = Math.max(...lines.map(l => ctx.measureText(l).width));
  return { lines, w: Math.ceil(width) + s.padX * 2, h: lines.length * s.line + s.padY * 2 };
}

function prepare(node, level) {
  Object.assign(node, wrap(node.t, STYLE[level]), { level });
  node.c.forEach(ch => prepare(ch, level + 1));
}
const visible = node => (node.collapsed ? [] : node.c);

function blockHeight(node) {
  const kids = visible(node);
  if (!kids.length) return node.h;
  const total = kids.reduce((sum, k) => sum + blockHeight(k), 0) + GAP[node.level + 1] * (kids.length - 1);
  return Math.max(node.h, total);
}

function columns(branches) {
  const cols = [0, 0, 0];
  const walk = x => { cols[x.level - 1] = Math.max(cols[x.level - 1], x.w); visible(x).forEach(walk); };
  branches.forEach(walk);
  return cols;
}

function place(node, top, side, xs) {
  const block = blockHeight(node);
  node.cy = top + block / 2;
  const edge = xs[node.level - 1];
  node.inner = edge;                       // bord côté centre
  node.outer = edge + side * node.w;       // bord côté extérieur
  let y = top + (block - childrenHeight(node)) / 2;
  visible(node).forEach(k => { place(k, y, side, xs); y += blockHeight(k) + GAP[node.level + 1]; });
}
function childrenHeight(node) {
  const kids = visible(node);
  return kids.reduce((s, k) => s + blockHeight(k), 0) + GAP[node.level + 1] * Math.max(0, kids.length - 1);
}

function el(name, attrs, parent) {
  const e = document.createElementNS(SVG, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function curve(x1, y1, x2, y2, color, width, parent) {
  const mid = (x1 + x2) / 2;
  el("path", { d: `M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`, fill: "none",
               stroke: color, "stroke-width": width, "stroke-linecap": "round" }, parent);
}
function drawText(node, side, color, parent, fill) {
  const s = STYLE[node.level];
  const top = node.cy - node.h / 2 + s.padY;
  const left = Math.min(node.inner, node.outer);
  const leaf = node.level === 3;
  const x = leaf ? (side > 0 ? left + s.padX : left + node.w - s.padX) : left + node.w / 2;
  const anchor = leaf ? (side > 0 ? "start" : "end") : "middle";
  const text = el("text", { "font-size": s.size, "font-weight": s.weight, fill, "text-anchor": anchor,
                            "font-family": FONT }, parent);
  node.lines.forEach((line, i) => {
    const t = el("tspan", { x, y: top + s.line * (i + 0.76) }, text);
    t.textContent = line;
  });
}

const ROOT = { lines: ["L'inertie thermique", "d'un bâtiment"], w: 220, h: 84 };

function drawSide(branches, side, layer) {
  const cols = columns(branches);
  const start = ROOT.w / 2 + 60;
  const xs = [side * start,
              side * (start + cols[0] + COL_GAP),
              side * (start + cols[0] + cols[1] + COL_GAP * 2)];
  const total = branches.reduce((s, b) => s + blockHeight(b), 0) + GAP[1] * (branches.length - 1);
  let y = -total / 2;
  branches.forEach(b => { place(b, y, side, xs); y += blockHeight(b) + GAP[1]; });

  let minY = -ROOT.h / 2, maxY = ROOT.h / 2, far = start;
  const drawNode = (node, color, parentGroup) => {
    minY = Math.min(minY, node.cy - node.h / 2);
    maxY = Math.max(maxY, node.cy + node.h / 2);
    far = Math.max(far, Math.abs(node.outer));
    visible(node).forEach(k => {
      curve(node.outer + (node.level === 1 && node.c.length ? side * 11 : 0), node.cy, k.inner - side * 2, k.cy,
            color, node.level === 1 ? 2.2 : 1.4, layer.links);
      drawNode(k, color, parentGroup);
    });
    const left = Math.min(node.inner, node.outer);
    if (node.level === 2) {
      el("rect", { x: left, y: node.cy - node.h / 2, width: node.w, height: node.h, rx: 7,
                   fill: color + "18", stroke: color, "stroke-width": 1.2 }, layer.nodes);
      drawText(node, side, "#24292f", layer.nodes, "#24292f");
    } else if (node.level === 3) {
      drawText(node, side, color, layer.nodes, "#333a42");
    }
  };

  branches.forEach(b => {
    curve(side * ROOT.w / 2, 0, b.inner, b.cy, b.color, 3.2, layer.links);
    drawNode(b, b.color);
    const group = el("g", { class: "branch", tabindex: 0, role: "button",
                            "aria-expanded": String(!b.collapsed),
                            "aria-label": `${b.t} : ${b.collapsed ? "déplier" : "replier"}` }, layer.nodes);
    const left = Math.min(b.inner, b.outer);
    el("rect", { x: left, y: b.cy - b.h / 2, width: b.w, height: b.h, rx: 10, fill: b.color }, group);
    drawText(b, side, b.color, group, "#fff");
    el("circle", { cx: b.outer + side * 2, cy: b.cy, r: 9, fill: "#fff", stroke: b.color, "stroke-width": 1.6 }, group);
    const sign = el("text", { x: b.outer + side * 2, y: b.cy + 5, "text-anchor": "middle", "font-size": 15,
                              "font-weight": 700, fill: b.color, "font-family": FONT }, group);
    sign.textContent = b.collapsed ? "+" : "−";
    const toggle = () => { b.collapsed = !b.collapsed; render(document.activeElement === group ? b.t : null); };
    group.addEventListener("click", toggle);
    group.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
    group.dataset.branch = b.t;
  });
  return { minY, maxY, far };
}

function render(focusBranch) {
  svg.replaceChildren();
  const links = el("g", {}, svg);
  const nodes = el("g", {}, svg);
  const layer = { links, nodes };
  const r = drawSide(RIGHT, 1, layer);
  const l = drawSide(LEFT, -1, layer);

  el("rect", { x: -ROOT.w / 2, y: -ROOT.h / 2, width: ROOT.w, height: ROOT.h, rx: 16, fill: "#24292f" }, nodes);
  ROOT.lines.forEach((line, i) => {
    const t = el("text", { x: 0, y: -5 + i * 26, "text-anchor": "middle", "font-size": 20, "font-weight": 700,
                           fill: "#fff", "font-family": FONT }, nodes);
    t.textContent = line;
    if (i === 1) t.setAttribute("y", 21);
  });

  const pad = 30;
  const minY = Math.min(r.minY, l.minY) - pad, maxY = Math.max(r.maxY, l.maxY) + pad;
  const minX = -l.far - pad, maxX = r.far + pad;
  svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
  if (focusBranch) svg.querySelector(`[data-branch="${focusBranch}"]`)?.focus();
}

const ALL = [...RIGHT, ...LEFT];
ALL.forEach(b => prepare(b, 1));
document.getElementById("open").onclick = () => { ALL.forEach(b => b.collapsed = false); render(); };
document.getElementById("close").onclick = () => { ALL.forEach(b => b.collapsed = true); render(); };
render();
</script>
</body>
</html>
