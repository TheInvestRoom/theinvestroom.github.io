<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2ece5; }

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="title">Maison de poupée<small>Appartement T3 · 69 m² · hauteur sous plafond 2,50 m</small></div>
<div id="caption"></div>
<div id="hint">Espace : pause</div>
<div id="fade"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* =====================================================================
   RELEVÉ DU PLAN (mètres). Origine = angle extérieur nord-ouest.
   x vers l'est, z vers le sud. Échelle mesurée : barre 0–4 m et cotes
   9,80 m / 7,00 m (entre axes des murs extérieurs) -> ~135 px/m.
   Murs extérieurs 0,25 m, cloisons 0,10 m.
   ===================================================================== */
const HC = 2.50;                 // hauteur sous plafond
const EXT_W = 10.05, EXT_D = 7.25; // emprise extérieure (9,80 + 0,25 / 7,00 + 0,25)
const PLONGEE = true;            // après l'envol du toit, la caméra plonge un peu (52°) pour voir dans les pièces
const LOOP = 36;                 // durée d'un cycle (s)

const BG = '#f2ece5';

/* ---------- utilitaires ---------- */
const clamp01 = v => Math.min(1, Math.max(0, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t*t*t;
function easeOutBounce(x) {
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1/d1) return n1*x*x;
  if (x < 2/d1) return n1*(x -= 1.5/d1)*x + .75;
  if (x < 2.5/d1) return n1*(x -= 2.25/d1)*x + .9375;
  return n1*(x -= 2.625/d1)*x + .984375;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
function shade(c, dl) { const col = new THREE.Color(c), hsl = {}; col.getHSL(hsl); col.setHSL(hsl.h, hsl.s, clamp01(hsl.l + dl)); return '#' + col.getHexString(); }
const FACE = { S: 0, N: Math.PI, E: Math.PI/2, W: -Math.PI/2 };

/* ---------- moteur ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'labels';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);

scene.add(new THREE.HemisphereLight('#fffaf3', '#d8cfe0', 1.55));
const sun = new THREE.DirectionalLight('#fff3e6', 2.3);
sun.position.set(-8, 14, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun);

// sol d'ombre (fond uni, on ne garde que l'ombre portée)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ color: '#6b5a50', opacity: .16 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.3; ground.receiveShadow = true;
scene.add(ground);

const root = new THREE.Group();
root.position.set(-EXT_W/2, 0, -EXT_D/2);
scene.add(root);

/* ---------- matériaux / géométries ---------- */
const matCache = new Map();
function mat(color, extra) {
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: .82, metalness: 0, ...extra }));
  return matCache.get(key);
}
const geoCache = new Map();
function rbox(w, h, d, r) {
  r = Math.min(r, w/2 - .001, h/2 - .001, d/2 - .001);
  const key = [w, h, d, r].map(v => v.toFixed(4)).join('|');
  if (!geoCache.has(key)) geoCache.set(key, r > .003 ? new RoundedBoxGeometry(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d));
  return geoCache.get(key);
}
function shadowed(m, cast = true) { m.castShadow = cast; m.receiveShadow = true; return m; }
// boîte posée : (x, z) = centre, y = base
function B(p, w, h, d, color, x = 0, y = 0, z = 0, r = .02) {
  const m = shadowed(new THREE.Mesh(rbox(w, h, d, r), typeof color === 'string' ? mat(color) : color));
  m.position.set(x, y + h/2, z); p.add(m); return m;
}
function Cyl(p, rt, rb, h, color, x = 0, y = 0, z = 0, seg = 22) {
  const m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), typeof color === 'string' ? mat(color) : color));
  m.position.set(x, y + h/2, z); p.add(m); return m;
}
function Sph(p, r, color, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = shadowed(new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat(color)));
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); p.add(m); return m;
}
function Cap(p, r, len, color, x, y, z) {
  const m = shadowed(new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 14), mat(color)));
  m.position.set(x, y, z); p.add(m); return m;
}

/* ---------- textures de sol (canvas) ---------- */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function finishTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  return t;
}
// 8 lames de 14 cm -> la texture couvre 1,12 m
function parquetTex(base, seed) {
  const r = rng(seed), c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), col = new THREE.Color(base), hsl = {}; col.getHSL(hsl);
  for (let row = 0; row < 8; row++) {
    let x = -r() * 300;
    while (x < 512) {
      const len = 170 + r() * 230;
      const k = new THREE.Color().setHSL(hsl.h + (r() - .5) * .015, hsl.s * (.85 + r() * .3), hsl.l + (r() - .5) * .06);
      for (const off of [0, 512, -512]) {
        g.fillStyle = '#' + k.getHexString(); g.fillRect(x + off, row * 64, len, 64);
        g.strokeStyle = 'rgba(120,85,60,.07)'; g.lineWidth = 1;
        for (let i = 0; i < 5; i++) { const y = row * 64 + 8 + r() * 48; g.beginPath(); g.moveTo(x + off, y); g.bezierCurveTo(x + off + len * .3, y + (r() - .5) * 6, x + off + len * .6, y + (r() - .5) * 6, x + off + len, y); g.stroke(); }
        g.strokeStyle = 'rgba(110,75,55,.22)'; g.lineWidth = 2; g.strokeRect(x + off, row * 64, len, 64);
      }
      x += len;
    }
  }
  return finishTex(c);
}
function tileTex(c1, c2, grout, n, checker) {
  const r = rng(n * 13 + 1), c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), s = 512 / n;
  g.fillStyle = grout; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const base = checker && (i + j) % 2 ? c2 : c1;
    g.fillStyle = shade(base, (r() - .5) * .03);
    g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
  return finishTex(c);
}

/* ---------- sols ---------- */
// dalle porteuse
const slab = B(root, EXT_W, .3, EXT_D, '#e2d6ca', EXT_W/2, -.3, EXT_D/2, .01);
B(root, 4.01, .2, 1.40, '#e2d6ca', 3.125, -.24, -0.70, .01); // dalle du balcon

function floor(x1, x2, z1, z2, tex, texSize, rotate, y = .002) {
  const w = x2 - x1, d = z2 - z1, t = tex.clone(); t.needsUpdate = true;
  if (rotate) { t.center.set(.5, .5); t.rotation = Math.PI/2; t.repeat.set(d / texSize, w / texSize); }
  else t.repeat.set(w / texSize, d / texSize);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshStandardMaterial({ map: t, roughness: .75 }));
  m.rotation.x = -Math.PI/2; m.position.set((x1 + x2)/2, y, (z1 + z2)/2); m.receiveShadow = true;
  root.add(m); return m;
}
floor(0.25, 6.28, 0.25, 3.67, parquetTex('#ecd7b9', 1), 1.12);               // séjour : parquet chêne clair
floor(3.57, 5.47, 3.67, 7.00, tileTex('#f0cdb9', null, '#f8eee6', 6), 2.0);   // entrée : carrelage terracotta pastel 33 cm
floor(0.25, 3.48, 3.77, 7.00, parquetTex('#ebcbbb', 2), 1.12, true);          // chambre 1 : parquet rosé
floor(6.37, 9.80, 0.25, 3.67, parquetTex('#dcc19c', 3), 1.12, true);          // chambre 2 : parquet miel
floor(5.57, 9.80, 3.77, 4.87, parquetTex('#e1d8cc', 4), 1.12);                // dégagement : parquet gris clair
floor(5.57, 8.07, 4.97, 7.00, tileTex('#cfe5ed', null, '#f4f9fb', 10), 1.5);  // salle de bains : petit carrelage bleu
floor(8.17, 9.80, 4.97, 7.00, tileTex('#d8cfe9', '#f7f4fb', '#ece6f3', 6, true), 1.8); // buanderie : damier lavande
floor(1.12, 5.13, -1.40, 0.00, parquetTex('#d6cec6', 5), 1.12, false, -.035); // balcon : lames bois grisé

/* ---------- murs (montent par « tranches » : on voit toujours la coupe) ---------- */
const wallSide = mat('#f7f2ec');
const wallTop = mat('#3a3440');   // dessus des murs : coupe sombre
const sillTop = mat('#fdfbf7');
const frameMat = mat('#fbf9f6');
const glassMat = new THREE.MeshStandardMaterial({ color: '#cfe7f1', transparent: true, opacity: .42, roughness: .08 });
const leafMat = mat('#e8d6bf');
const railMat = mat('#c9d3d8');
const pieces = [];
function piece(x1, x2, z1, z2, base, h, top = wallTop, side = wallSide, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x2 - x1, h, z2 - z1), [side, side, top, side, side, side]);
  m.position.set((x1 + x2)/2, base + h/2, (z1 + z2)/2);
  m.castShadow = cast; m.receiveShadow = true;
  root.add(m); pieces.push({ m, base, h });
  return m;
}
const WIN = (a, b, sill = .9, head = 2.15) => ({ a, b, k: 'win', sill, head });
const FR  = (a, b) => ({ a, b, k: 'win', sill: 0, head: 2.15 });            // porte-fenêtre
const DOOR = (a, b, head = 2.04) => ({ a, b, k: 'door', head });
const OPEN = (a, b) => ({ a, b, k: 'door', head: 2.20 });                   // passage libre avec linteau

function opening(alongX, o, f1, f2) {
  const rect = (a, b) => alongX ? [a, b, f1, f2] : [f1, f2, a, b];
  const mid = (f1 + f2) / 2;
  const thin = (a, b, t) => alongX ? [a, b, mid - t, mid + t] : [mid - t, mid + t, a, b];
  if (o.k === 'win') {
    const s = Math.max(o.sill, .02);
    piece(...rect(o.a, o.b), 0, s, sillTop);                                // allège (ou seuil)
    piece(...thin(o.a, o.b, .015), s, o.head - s, glassMat, glassMat, false); // vitrage
    if (o.b - o.a >= 1.15) { const m = (o.a + o.b) / 2; piece(...thin(m - .025, m + .025, .04), s, o.head - s, frameMat, frameMat); }
    piece(...rect(o.a, o.b), o.head, HC - o.head);                          // linteau
  } else {
    piece(...rect(o.a, o.b), o.head, HC - o.head);
  }
}
function wallX(z1, z2, x1, x2, ops = []) { let c = x1; for (const o of ops) { if (o.a > c) piece(c, o.a, z1, z2, 0, HC); opening(true, o, z1, z2); c = o.b; } if (c < x2) piece(c, x2, z1, z2, 0, HC); }
function wallZ(x1, x2, z1, z2, ops = []) { let c = z1; for (const o of ops) { if (o.a > c) piece(x1, x2, c, o.a, 0, HC); opening(false, o, x1, x2); c = o.b; } if (c < z2) piece(x1, x2, c, z2, 0, HC); }

// murs extérieurs (0,25 m)
wallX(0.00, 0.25, 0, EXT_W, [FR(1.12, 2.92), FR(3.72, 5.52), WIN(7.33, 8.92)]);                     // nord
wallX(7.00, 7.25, 0, EXT_W, [WIN(0.92, 2.73), DOOR(4.12, 5.05, 2.10), WIN(6.32, 7.12, 1.2), WIN(8.72, 9.32, 1.2)]); // sud
wallZ(0.00, 0.25, 0.25, 7.00, [WIN(1.12, 2.73), WIN(4.93, 6.13)]);                                 // ouest
wallZ(9.80, 10.05, 0.25, 7.00, [WIN(1.33, 2.53)]);                                                 // est
// cloisons (0,10 m)
wallX(3.67, 3.77, 0.25, 9.80, [OPEN(3.67, 5.27), DOOR(8.12, 8.95)]);   // séjour | chambre 1, entrée, dégagement
wallZ(6.28, 6.37, 0.25, 3.67);                                          // séjour | chambre 2
wallZ(3.48, 3.57, 3.77, 7.00, [DOOR(4.39, 5.22)]);                      // chambre 1 | entrée
wallZ(5.47, 5.57, 3.77, 7.00, [DOOR(3.89, 4.73)]);                      // entrée | dégagement, sdb
wallX(4.87, 4.97, 5.57, 9.80, [DOOR(6.52, 7.25), DOOR(8.72, 9.45)]);   // dégagement | sdb, buanderie
wallZ(8.07, 8.17, 4.97, 7.00);                                          // sdb | buanderie

// vantaux de portes, ouverts comme dessinés sur le plan
[[4.12, 4.16, 6.10, 7.00], [2.69, 3.48, 5.20, 5.24], [5.57, 6.35, 4.69, 4.73],
 [8.12, 8.16, 2.87, 3.67], [6.52, 6.56, 4.97, 5.66], [8.72, 8.76, 4.97, 5.66]]
  .forEach(([a, b, c, d]) => piece(a, b, c, d, 0, 2.03, leafMat, leafMat));

// garde-corps du balcon
const glassRail = new THREE.MeshStandardMaterial({ color: '#d5ece4', transparent: true, opacity: .4, roughness: .1 });
[[1.12, 5.13, -1.40, -1.36], [1.12, 1.16, -1.40, 0], [5.09, 5.13, -1.40, 0]].forEach(([a, b, c, d]) => {
  piece(a, b, c, d, .06, .88, glassRail, glassRail, false);
  piece(a, b, c, d, .94, .05, railMat, railMat);
});
[[1.14, -1.38], [5.11, -1.38], [3.12, -1.38], [1.14, -0.7], [5.11, -0.7]].forEach(([x, z]) => piece(x - .025, x + .025, z - .025, z + .025, 0, .99, railMat, railMat));

/* ---------- arcs de portes (phase « plan ») ---------- */
const arcMat = new THREE.MeshBasicMaterial({ color: '#6c6370', transparent: true, side: THREE.DoubleSide });
const DEG = Math.PI / 180;
[[4.12, 7.00, .93, 0], [3.48, 5.22, .79, 180], [5.52, 4.73, .84, 0],
 [8.12, 3.72, .83, 0], [6.52, 4.97, .71, 270], [8.72, 4.97, .71, 270]].forEach(([x, z, r, a0]) => {
  const m = new THREE.Mesh(new THREE.RingGeometry(r - .018, r, 40, 1, a0 * DEG, 90 * DEG), arcMat);
  m.rotation.x = -Math.PI/2; m.position.set(x, .006, z); root.add(m);
});

/* ---------- plafond / toit qui s'envole ---------- */
const ceilMats = [
  new THREE.MeshStandardMaterial({ color: '#e7b9b3', roughness: .8, transparent: true }), // tranche
  new THREE.MeshStandardMaterial({ color: '#f1cbc5', roughness: .8, transparent: true }), // dessus
  new THREE.MeshStandardMaterial({ color: '#fbf7f2', roughness: .9, transparent: true }), // sous-face
];
const ceilPivot = new THREE.Group(); // charnière sur la façade nord
root.add(ceilPivot);
const ceil = new THREE.Mesh(new THREE.BoxGeometry(EXT_W + .2, .16, EXT_D + .2),
  [ceilMats[0], ceilMats[0], ceilMats[1], ceilMats[2], ceilMats[0], ceilMats[0]]);
ceil.position.set(0, .08, EXT_D/2); ceil.castShadow = true; ceilPivot.add(ceil);
const trim = new THREE.Mesh(new THREE.BoxGeometry(EXT_W - .6, .03, EXT_D - .6), ceilMats[2]);
trim.position.set(0, .175, EXT_D/2); ceilPivot.add(trim);

/* =====================================================================
   MOBILIER (local : face avant vers +z, posé sur y = 0, centré)
   ===================================================================== */
function rug(w, d, col) { const g = new THREE.Group(); const m = B(g, w, .012, d, col, 0, 0, 0, .004); m.castShadow = false; return g; }
function sofa(w, d, col) {
  const g = new THREE.Group(), light = shade(col, .06);
  B(g, w, .40, d, col, 0, .04, 0, .05);
  B(g, w, .48, .22, col, 0, .40, -d/2 + .11, .07);
  B(g, .2, .24, d, col, -w/2 + .1, .40, 0, .07); B(g, .2, .24, d, col, w/2 - .1, .40, 0, .07);
  const n = w > 1.4 ? 2 : 1, cw = (w - .4) / n;
  for (let i = 0; i < n; i++) B(g, cw - .03, .1, d - .26, light, -w/2 + .2 + cw * (i + .5), .44, .1, .045);
  if (n === 2) { const p1 = B(g, .34, .3, .12, '#f3d9a6', -w/2 + .45, .5, -d/2 + .3, .05); p1.rotation.z = .15;
                 const p2 = B(g, .34, .3, .12, '#efb7b0', w/2 - .45, .5, -d/2 + .3, .05); p2.rotation.z = -.15; }
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) Cyl(g, .025, .02, .04, '#b59a80', sx * (w/2 - .08), 0, sz * (d/2 - .08), 10);
  return g;
}
function table(w, d, h, top, leg) {
  const g = new THREE.Group();
  B(g, w, .04, d, top, 0, h - .04, 0, .015);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) B(g, .05, h - .04, .05, leg, sx * (w/2 - .07), 0, sz * (d/2 - .07), .01);
  return g;
}
function chair(col, wood = '#d7bc9c') {
  const g = new THREE.Group();
  B(g, .42, .05, .42, col, 0, .42, 0, .015);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) B(g, .035, .42, .035, wood, sx * .18, 0, sz * .18, .008);
  B(g, .42, .4, .04, col, 0, .47, -.19, .015);
  return g;
}
function roundTable(r, h, col) {
  const g = new THREE.Group();
  Cyl(g, r, r, .03, col, 0, h - .03, 0, 28); Cyl(g, .025, .025, h - .03, '#b9c3c7'); Cyl(g, .2, .22, .02, '#b9c3c7');
  return g;
}
function bed(w, l, frame, sheet, duvet, pillow) {
  const g = new THREE.Group();
  B(g, w + .06, .28, l, frame, 0, 0, 0, .03);
  B(g, w, .18, l - .08, sheet, 0, .28, .02, .05);
  B(g, w + .06, .95, .07, frame, 0, 0, -l/2 + .035, .03);

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const c of corners) { _v.copy(c).applyQuaternion(_qi); x0 = Math.min(x0, _v.x); x1 = Math.max(x1, _v.x); y0 = Math.min(y0, _v.y); y1 = Math.max(y1, _v.y); }
  let hw = (x1 - x0) / 2 * 1.12, hh = (y1 - y0) / 2 * 1.24;
  const a = innerWidth / innerHeight;
  if (hw / hh > a) hh = hw / a; else hw = hh * a;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - hh * .03;
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.position.set(cx, cy, 60).applyQuaternion(camera.quaternion);
  camera.updateProjectionMatrix();
}

/* ---------- boucle d'animation (tout dépend uniquement de t) ---------- */
const caption = document.getElementById('caption'), fade = document.getElementById('fade');
let lastCaption = '';
function update(t) {
  // 1. caméra
  const k1 = easeInOut(seg(t, 2.8, 5.3));
  let pitch = lerp(Math.PI / 2, ISO, k1), az = lerp(0, AZ, k1);
  if (PLONGEE) pitch += (DIVE - ISO) * easeInOut(seg(t, 11.0, 13.2));
  az += Math.sin((t - 13) * .33) * .07 * easeInOut(seg(t, 13, 16)) * (1 - seg(t, 33, 35));
  placeCamera(pitch, az);

  // 2. murs : la « coupe » monte de 1 cm à 2,50 m
  const H = lerp(.012, HC, easeInOut(seg(t, 5.0, 8.0)));
  for (const p of pieces) {
    const vis = Math.min(p.h, H - p.base);
    if (vis <= .0005) { p.m.visible = false; continue; }
    p.m.visible = true; p.m.scale.y = vis / p.h; p.m.position.y = p.base + vis / 2;
  }
  arcMat.opacity = 1 - seg(t, 4.6, 6.2);

  // 3. plafond : se pose, se soulève, s'envole
  const cIn = seg(t, 8.0, 9.0), cLift = seg(t, 9.4, 10.3), cFly = seg(t, 10.3, 12.4);
  ceilPivot.visible = t > 8.0 && cFly < 1;
  if (ceilPivot.visible) {
    const fly = easeInCubic(cFly);
    ceilPivot.position.set(EXT_W/2 - fly * 3, HC + (1 - easeOutCubic(cIn)) * 3 + easeInOut(cLift) * .45 + fly * 9, -fly * 5);
    ceilPivot.rotation.set(-.14 * easeInOut(cLift) - cFly * .7, 0, cFly * .3);
    const op = easeOutCubic(cIn) * (1 - cFly * cFly);
    ceilMats.forEach(m => m.opacity = op);
    ceil.castShadow = cFly < .3;
  }

  // 4. mobilier qui tombe en place, pièce par pièce
  for (const g of furn) {
    const u = g.userData, p = seg(t, u.t0, u.t0 + .75);
    if (p <= 0) { g.visible = false; continue; }
    g.visible = true;
    g.position.y = u.base + (1 - easeOutBounce(p)) * 1.3;
    g.scale.setScalar(.55 + .45 * easeOutCubic(Math.min(1, p * 1.5)));
    if (u.idle && u.body) {
      u.body.position.y = Math.abs(Math.sin(t * 2.2 + u.phase)) * .02 * p;
      g.rotation.y = u.rot + Math.sin(t * .8 + u.phase) * .18 * p;
    }
  }

  // 5. étiquettes
  for (const L of labels) {
    const p = easeOutCubic(seg(t, LABEL_T + L.i * .18, LABEL_T + L.i * .18 + .6)) * (1 - seg(t, 34.6, 35.4));
    L.wrap.style.visibility = p > 0 ? 'visible' : 'hidden';
    L.wrap.style.opacity = p;
    L.el.style.transform = `translateY(${(1 - p) * 14 + Math.sin(t * 1.6 + L.i) * 3}px)`;
  }

  // 6. légende + fondu de bouclage
  const cap = t < 2.8 ? 'Le plan, vu de dessus' : t < 5.2 ? 'Bascule en isométrie' : t < 8.2 ? 'Les murs montent · 2,50 m'
            : t < 12.4 ? 'Le toit se soulève et s’envole' : t < LABEL_T ? 'On emménage, pièce par pièce…' : 'Appartement T3 · 69 m²';
  if (cap !== lastCaption) { caption.textContent = cap; lastCaption = cap; }
  fade.style.opacity = Math.max(1 - seg(t, 0, .8), seg(t, 35.0, 35.9));
}

// ?t=20 démarre à 20 s, ?t=20&pause fige l'image
const qs = new URLSearchParams(location.search);
let t = (parseFloat(qs.get('t')) || 0) % LOOP, paused = qs.has('pause'), prev = performance.now();
addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });
function frame(now) {
  const dt = Math.min(.05, (now - prev) / 1000); prev = now;
  if (!paused) t = (t + dt) % LOOP;
  update(t);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
</script>
