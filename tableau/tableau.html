<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi de chantier · tableau de bord</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0D1430;color:#EEF1FA;font-family:"Segoe UI",Arial,sans-serif}
.p{width:min(1000px,100%);margin:0 auto;padding:30px 34px}

8630], ["Sols et peintures", "Finitions Roy", "août", 7400, 7150], ["Sols et peintures", "Finitions Roy", "septembre", 8800, 8500]]};const M=D.mois;const L=D.lignes;let lot=null,tri=0;
const eu=n=>Math.round(n).toLocaleString('fr-FR').replace(/ | /g,' ')+' €';
const sg=n=>(n>0?'+':n<0?'−':'')+eu(Math.abs(n));
function lignes(ignoreLot){return L.filter(l=>(!lot||ignoreLot||l[0]===lot)&&(!tri||Math.floor(M.indexOf(l[2])/3)+1===tri))}

function tracer(){const ls=lignes();const P=ls.reduce((a,l)=>a+l[3],0),E=ls.reduce((a,l)=>a+l[4],0);
 vp.textContent=eu(P);ve.textContent=eu(E);vx.textContent=sg(E-P);vx.className='v '+((E-P)>0?'r':'g');
 const ms=M.filter((m,i)=>!tri||Math.floor(i/3)+1===tri);let cp=0,ce=0;const a=[],b=[];ms.forEach(m=>{ls.filter(l=>l[2]===m).forEach(l=>{cp+=l[3];ce+=l[4]});a.push(cp);b.push(ce)});

 `<text x="30" y="26" fill="#FFC857" font-size="22" font-weight="700">engagé</text><text x="130" y="26" fill="#9AA5D2" font-size="22" font-weight="700">prévu</text>`;
 const par={};lignes(true).forEach(l=>{const t=par[l[0]]||(par[l[0]]=[0,0]);t[0]+=l[3];t[1]+=l[4]});
 const rang=Object.entries(par).sort((x,y)=>(y[1][1]-y[1][0])/y[1][0]-(x[1][1]-x[1][0])/x[1][0]).slice(0,8);const mp=Math.max(...rang.map(r=>Math.abs((r[1][1]-r[1][0])/r[1][0])),.01);
